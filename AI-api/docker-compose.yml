services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: mushroom-classifier-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mushroom_classifier}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mushroom-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mushroom-classifier-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mushroom_classifier}
      MODEL_PATH: ${MODEL_PATH:-/app/weights/model.pth}
    volumes:
      - ./app:/app/app
      - ./weights:/app/weights
      - ./alembic:/app/alembic
      - ./.env:/app/.env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mushroom-network
    command: >
      sh -c "
        alembic upgrade head || echo 'No migrations to run yet' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:

networks:
  mushroom-network:
    driver: bridge
